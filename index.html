:root {
  /* ---------- Color — Surfaces ---------- */
  --cream:          #FBF8F2;   /* page bg */
  --cream-2:        #F3EEE4;   /* alt panel */
  --porcelain:      #FFFFFD;   /* crisp white */
  --whisper:        #EEECE6;   /* divider fill / subtle surface */

  /* ---------- Color — Blush (pink) ---------- */
  --blush:          #EFE1DA;
  --blush-2:        #E6CFC4;

  /* ---------- Color — Neutrals & accent ---------- */
  --sage:           #AAAD9C;   /* mid neutral / borders */
  --warm-gray:      #726868;   /* secondary text */
  --ink:            #2B2622;   /* body copy */

  --olive:          #786F29;   /* primary accent */
  --olive-dark:     #5E561F;   /* hover */
  --olive-soft:     #D6D2B8;   /* tinted backgrounds */

  /* ---------- Semantic ---------- */
  --bg:             var(--cream);
  --bg-alt:         var(--cream-2);
  --fg:             var(--ink);
  --fg-2:           var(--warm-gray);
  --fg-3:           var(--sage);
  --accent:         var(--olive);
  --accent-hover:   var(--olive-dark);
  --border:         rgba(170, 173, 156, 0.40);      /* sage @ 40% */
  --border-soft:    rgba(170, 173, 156, 0.20);
  --scrim:          rgba(43, 38, 34, 0.35);

  /* ---------- Typography ---------- */
  --font-display:   'Cormorant Garamond', 'Forum', Georgia, 'Times New Roman', serif;
  --font-body:      'Inter Tight', 'Tilda Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono:      ui-monospace, SFMono-Regular, Menlo, monospace;

  /* Type scale (fluid — clamp based on 1440 design width) */
  --fs-hero:        clamp(48px, 6.25vw, 96px);   /* oversized watermark words */
  --fs-display-1:   clamp(36px, 3.75vw, 54px);   /* section title serif */
  --fs-display-2:   clamp(28px, 2.8vw,  40px);
  --fs-display-3:   clamp(22px, 2.0vw,  28px);
  --fs-lead:        clamp(17px, 1.3vw,  19px);   /* body lead */
  --fs-body:        16px;
  --fs-small:       14px;
  --fs-micro:       12px;
  --fs-eyebrow:     11px;                        /* all-caps meta */

  /* Tracking */
  --track-tight:    -0.01em;
  --track-normal:    0;
  --track-wide:      0.05em;
  --track-wider:     0.12em;
  --track-display:   0.08em;   /* all-caps display */

  /* Line heights */
  --lh-tight:        1.1;
  --lh-display:      1.15;
  --lh-body:         1.55;
  --lh-relaxed:      1.7;

  /* ---------- Spacing (8px base) ---------- */
  --space-1:   4px;
  --space-2:   8px;
  --space-3:   12px;
  --space-4:   16px;
  --space-5:   24px;
  --space-6:   32px;
  --space-7:   48px;
  --space-8:   64px;
  --space-9:   96px;
  --space-10:  128px;

  /* ---------- Radii ---------- */
  --radius-xs:   4px;
  --radius-sm:   6px;
  --radius-md:   8px;
  --radius-lg:   12px;
  --radius-pill: 999px;

  /* ---------- Shadows ---------- */
  --shadow-whisper: 0 1px 2px rgba(43, 38, 34, 0.04),
                    0 2px 8px  rgba(43, 38, 34, 0.04);
  --shadow-soft:    0 4px 16px rgba(43, 38, 34, 0.06),
                    0 8px 32px rgba(43, 38, 34, 0.05);
  --shadow-lifted:  0 12px 32px rgba(43, 38, 34, 0.10);

  /* ---------- Motion ---------- */
  --ease:          cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out:      cubic-bezier(0.16, 1, 0.3, 1);
  --dur-fast:      180ms;
  --dur-base:      300ms;
  --dur-slow:      600ms;
  --dur-breath:    800ms;

  /* ---------- Layout ---------- */
  --container:     1280px;
  --reading:       720px;
  --pad-page:      96px;
  --pad-page-sm:   24px;
}

/* =============================================================
   Base reset / element defaults
   ============================================================= */

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* =============================================================
   Typography — semantic classes
   ============================================================= */

.type-watermark {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: var(--fs-hero);
  letter-spacing: var(--track-display);
  line-height: var(--lh-tight);
  color: var(--whisper);
  text-transform: uppercase;
}

.type-display-1,
h1 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: var(--fs-display-1);
  line-height: var(--lh-display);
  letter-spacing: var(--track-tight);
  color: var(--ink);
  margin: 0;
}

.type-display-1.is-caps {
  text-transform: uppercase;
  letter-spacing: var(--track-display);
  font-weight: 500;
}

.type-display-2,
h2 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: var(--fs-display-2);
  line-height: var(--lh-display);
  letter-spacing: var(--track-tight);
  color: var(--ink);
  margin: 0;
}

.type-display-3,
h3 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: var(--fs-display-3);
  line-height: var(--lh-display);
  letter-spacing: 0;
  color: var(--ink);
  margin: 0;
}

.type-italic-accent {
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 400;
  color: var(--olive);
}

.type-lead,
p.lead {
  font-family: var(--font-body);
  font-size: var(--fs-lead);
  line-height: var(--lh-relaxed);
  color: var(--warm-gray);
  font-weight: 400;
}

.type-body, p {
  font-family: var(--font-body);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  color: var(--ink);
  font-weight: 400;
  margin: 0 0 1em;
}

.type-small, small {
  font-size: var(--fs-small);
  color: var(--warm-gray);
}

.type-eyebrow {
  font-family: var(--font-body);
  font-size: var(--fs-eyebrow);
  text-transform: uppercase;
  letter-spacing: var(--track-wider);
  color: var(--warm-gray);
  font-weight: 500;
}

.type-bracket {
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 300;
  font-size: var(--fs-small);
  color: var(--warm-gray);
  letter-spacing: 0.02em;
}
.type-bracket::before { content: '/ '; opacity: 0.6; }
.type-bracket::after  { content: ' /'; opacity: 0.6; }

a {
  color: var(--olive);
  text-decoration: none;
  position: relative;
  transition: color var(--dur-base) var(--ease);
}
a:hover { color: var(--olive-dark); }

/* =============================================================
   Buttons — primary / secondary / ghost
   ============================================================= */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-family: var(--font-body);
  font-size: var(--fs-small);
  font-weight: 500;
  letter-spacing: var(--track-wide);
  text-transform: uppercase;
  padding: 14px 28px;
  border-radius: var(--radius-pill);
  border: 1px solid transparent;
  cursor: pointer;
  transition: background var(--dur-base) var(--ease),
              color var(--dur-base) var(--ease),
              border-color var(--dur-base) var(--ease),
              transform var(--dur-fast) var(--ease);
  white-space: nowrap;
}

.btn-primary {
  background: var(--olive);
  color: var(--cream);
  border-color: var(--olive);
}
.btn-primary:hover { background: var(--olive-dark); border-color: var(--olive-dark); }
.btn-primary:active { transform: translateY(1px); }

.btn-secondary {
  background: transparent;
  color: var(--ink);
  border-color: var(--ink);
}
.btn-secondary:hover { background: var(--ink); color: var(--cream); }

.btn-ghost {
  background: transparent;
  color: var(--olive);
  border-color: transparent;
  padding: 14px 8px;
}
.btn-ghost:hover { color: var(--olive-dark); }

/* =============================================================
   Utility: hairline divider with center ornament
   ============================================================= */
.rule {
  display: flex;
  align-items: center;
  gap: 16px;
  color: var(--sage);
  font-family: var(--font-display);
}
.rule::before, .rule::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* =============================================================
   Responsive — mobile overrides (≤768px)
   Targets the UI kit's inline-styled sections.
   ============================================================= */
@media (max-width: 900px) {
  /* Header — compact mobile bar with drawer trigger */
  header {
    padding: 16px 20px !important;
    flex-wrap: nowrap;
    gap: 12px;
  }
  header > div:first-child {
    flex: 1 1 auto;
    min-width: 0;
    max-width: calc(100% - 52px);
  }
  header > div:first-child > div:first-child {  /* brand name */
    font-size: 16px !important;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  header > div:first-child > div:last-child {   /* brand subtitle */
    font-size: 8px !important;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  header button[aria-label="Меню"] {
    flex: 0 0 40px !important;
    width: 40px !important;
    height: 40px !important;
    padding: 0 !important;
    border-radius: 50%;
  }
  header button[aria-label="Меню"] span {
    flex: 0 0 auto;
  }
  .mobile-drawer-nav a {
    font-size: 24px !important;
  }
  .mobile-drawer-nav .mobile-drawer-cta {
    font-size: 12px !important;
    letter-spacing: 0.14em !important;
    line-height: 1.2 !important;
  }
  main div[style*="color: var(--warm-gray)"],
  main span[style*="color: var(--warm-gray)"] {
    color: #625a52 !important;
