[build]
  publish = "."

# Global security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://identity.netlify.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.netlify.com https://api.netlify.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self';"

# Admin panel — overrides security headers with policy for Sveltia CMS + GitHub OAuth
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "no-cache"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://unpkg.com/@sveltia/cms@0.164.0/; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https://unpkg.com/@sveltia/cms@0.164.0/; media-src blob:; frame-src blob:; connect-src 'self' blob: data: https://unpkg.com/@sveltia/cms@0.164.0/ https://api.github.com https://*.netlify.com https://api.netlify.com; frame-ancestors 'self'; object-src 'none';"

[[headers]]
  for = "/content.json"
  [headers.values]
    Cache-Control = "no-cache"
